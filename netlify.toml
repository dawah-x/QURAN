[build]
  publish = "."

# Asset filenames are NOT content-hashed, so never mark them immutable —
# otherwise browsers keep an old app.js/style.css after a deploy (and a new
# translation build would look like it "isn't there").
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
